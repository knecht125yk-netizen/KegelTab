# OPTIONAL: baut die Android-App als APK-Datei (kostenlos). Für die meisten reicht die Web-App.
# Start per Hand: Actions → "Optional · Android-APK bauen" → Run workflow.
name: "Optional · Android-APK bauen"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schlüssel vorhanden?
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt. Bitte zuerst '1 · Android-Schlüssel erzeugen' ausführen und die Secrets eintragen (siehe ANLEITUNG.md)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: App-Inhalt bauen
        run: npm run build

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#d93a2b' --iconBackgroundColorDark '#d93a2b' --splashBackgroundColor '#eceff5' --splashBackgroundColorDark '#0d111b'
          npx cap sync android

      - name: Versionsnummer setzen
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK bauen und signieren
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$PW" \
            -Pandroid.injected.signing.key.alias=kegelliste \
            -Pandroid.injected.signing.key.password="$PW"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/KegelTab-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KegelTab-Android-1.0.${{ github.run_number }}
          path: KegelTab-1.0.${{ github.run_number }}.apk

      - name: Als Download (Release) bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: KegelTab Android 1.0.${{ github.run_number }}
          body: APK auf dem Android-Gerät herunterladen und öffnen. Ein Update wird einfach über die alte Version installiert – die Daten bleiben erhalten.
          files: KegelTab-1.0.${{ github.run_number }}.apk
