# EINMALIG ausführen: erzeugt den Signaturschlüssel für die Android-App.
# Ohne immer denselben Schlüssel lassen sich spätere Updates nicht über die alte App installieren.
name: "Optional · Android-Schlüssel erzeugen (einmalig)"

on:
  workflow_dispatch:

jobs:
  schluessel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Schlüssel erzeugen
        run: |
          PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore release.keystore -alias kegelliste -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PW" -keypass "$PW" \
            -dname "CN=KegelTab, O=Die Umwerfenden, C=DE"
          base64 -w0 release.keystore > ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PW" > ANDROID_KEYSTORE_PASSWORD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-schluessel-NACH-DEM-EINTRAGEN-LOESCHEN
          path: |
            ANDROID_KEYSTORE_BASE64.txt
            ANDROID_KEYSTORE_PASSWORD.txt
          retention-days: 1
