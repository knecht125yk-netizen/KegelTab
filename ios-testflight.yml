# Baut die iPad/iPhone-App auf einem Mac in der Cloud und lädt sie zu TestFlight hoch.
# KOSTENPFLICHTIG (Apple-Entwicklerkonto 99 €/Jahr). Für den kostenlosen Weg: Web-App, siehe ANLEITUNG.md.
name: "Optional · iPad/iPhone zu TestFlight (kostet 99 €/Jahr)"

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      BUNDLE_ID: de.umwerfenden.kegelliste
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets vorhanden?
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret für $v fehlt (siehe ANLEITUNG.md)."; exit 1; fi
          done
          if [ -z "$P8" ]; then echo "::error::Secret ASC_KEY_P8 fehlt (siehe ANLEITUNG.md)."; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: App-Inhalt bauen
        run: npm run build

      - name: iOS-Projekt erzeugen
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --splashBackgroundColor '#eceff5' --splashBackgroundColorDark '#0d111b'
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Kegelliste" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Kegelliste" ios/App/App/Info.plist

      - name: App-Store-Connect-Schlüssel ablegen
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: App bauen (Archiv)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NO" MARKETING_VERSION="1.0.$BUILD_NO" TARGETED_DEVICE_FAMILY="1,2" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Zu TestFlight hochladen
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Version 1.0.$BUILD_NO ist hochgeladen. Nach ca. 10–30 Minuten erscheint sie in TestFlight."
